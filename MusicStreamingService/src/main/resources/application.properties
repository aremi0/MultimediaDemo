spring.application.name=music-streaming-service
server.port=0

########################### Eureka registration config
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka
eureka.instance.leaseRenewalIntervalInSeconds=10


########################### Spring Kafka Producer - service
app.kafka-producer.host=${KAFKA_PRODUCER_HOSTNAME:spring-kafka-producer}
app.kafka-producer.port=${KAFKA_PRODUCER_PORT:6565}
app.kafka-topic.request=${REQUEST_KAFKA_TOPIC:log.request.music-streaming-service}


########################### OAth2 Authentication/Authorization
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://${DOMAIN_NAME:multimedia-entrypoint}/realms/multimedia-realm


########################### Redis & MongoDB
spring.data.mongodb.uri=mongodb://${MONGO_USER:admin}:${MONGO_PASSWORD:admin}@${MONGODB_HOSTNAME:mongodb}:27017/music-streaming-service
spring.data.redis.host=${REDIS_HOSTNAME:redis}
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD:supersecret}